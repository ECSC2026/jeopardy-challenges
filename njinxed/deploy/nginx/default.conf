map $request_uri $edge_tag {
    default      "";
    ~^/portal/   "external";
}

upstream backend {
    server 127.0.0.1:5000;
}

server {
    listen 1024;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Edge $edge_tag;

    location = / {
        ssi on;
        proxy_pass http://backend;
    }

    location /portal/ {
        ssi on;
        proxy_pass http://backend;
    }

    location /fragments/ {
        internal;
        proxy_pass http://backend;
    }

    location /internal/ {
        internal;
        proxy_pass http://backend;
    }

    location /vault/ {
        internal;
        proxy_pass http://backend;
    }

    location / {
        return 404;
    }
}
