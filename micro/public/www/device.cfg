# ACME IoT Gateway - device configuration
# Generated by acme-provision 4.2.1, do not edit by hand.

[device]
model    = ACME-GW-220
serial   = GW220-0x5c9c1f
firmware = 4.2.1

[network]
listen   = 0.0.0.0:1337
mode     = static
upstream = gateway.acme.internal

[uploader]
# The Windows uploader sends backslash-separated paths.
# normalise_separators fixes those up on the way in.
normalise_separators = true
max_name_len         = 128
