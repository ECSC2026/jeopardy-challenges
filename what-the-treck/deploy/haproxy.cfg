global
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    option http-server-close
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

frontend fe
    bind *:1024
    # Fix CVE-2020-25066, as recommended by the advisory.
    http-request deny deny_status 400 if { hdr_val(content-length) le 0 }
    http-request deny deny_status 400 if { hdr_val(content-length) gt 2528 }
    # Reject chunked Transfer-Encoding, just in case.
    http-request deny deny_status 400 if { req.hdr(transfer-encoding) -m found }
    # Reject Range requests, just in case.
    http-request deny deny_status 400 if { req.hdr(range) -m found }
    # Cap the total request size, just in case.
    http-request deny deny_status 400 if { req.len gt 4096 }
    # Force a static Host header regardless of what the client sent.
    http-request set-header Host localhost
    default_backend be

backend be
    server treck 127.0.0.1:8080
